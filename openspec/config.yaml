schema: spec-driven

context: |
  Tech stack: NestJS 11, Node 22, TypeScript, MongoDB/Mongoose, Redis (ioredis), Firebase Admin
  Architecture: Modular NestJS with CASL authorization, TDD, colocated unit tests
  Testing: Jest unit tests with hand-rolled mocks
  Style: Code in English, end-user text in Spanish, relative imports, DTO filenames are Spanish-verb-prefixed

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run typecheck && npm run lint"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
